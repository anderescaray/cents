<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cents — the film</title>
<style>
  /* The app's own typeface, straight from the APK's resources: Inter 4, with its optical-size
     axis, so display sizes get the display cut. */
  @font-face {
    font-family: 'Inter';
    src: url('../app/src/main/res/font/inter_variable.ttf') format('truetype');
    font-weight: 100 900;
    font-style: normal;
  }

  html, body { margin: 0; height: 100%; background: #0b0b0c; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }

  #frame { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; }
  #stage {
    position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden;
    background: #F4F5F9; color: #0E1117;
    font-family: 'Inter', sans-serif; font-optical-sizing: auto;
    -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
    perspective: 2600px;
  }
  #stage * { box-sizing: border-box; }
  .a { position: absolute; left: 0; top: 0; }
  .layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; }
  .layer3d { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; perspective: 2600px; }
  .tnum { font-feature-settings: 'tnum' 1; }

  /* Kinetic type: each line is a mask, each letter rises inside it. */
  .kin { position: absolute; left: 0; top: 0; white-space: nowrap; }
  .kin-mask { display: block; overflow: hidden; padding: 0.06em 0.05em 0.2em; margin: -0.06em -0.05em -0.2em; }
  .kin-ch { display: inline-block; }

  /* A screen inside the phone: every screen is the phone's size. */
  .scr { position: absolute; left: 0; top: 0; width: 400px; height: 868px; }

  /* Preview chrome — never drawn during capture. */
  #controls { display: flex; gap: 12px; align-items: center; margin-top: 12px; font: 13px/1 -apple-system, system-ui, sans-serif; color: #ccc; }
  #controls button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 1px solid #333; background: #1c1c1e; color: #fff; cursor: pointer; }
  #controls input { width: 520px; }
  body.render #controls { display: none; }
  body.render { display: block; background: #F4F5F9; }
</style>
</head>
<body>
<div id="frame"><div id="stage"></div></div>
<div id="controls">
  <button id="play">Pause</button>
  <input id="scrub" type="range" min="0" max="65000" value="0">
  <span id="clock" class="tnum">0.000 s</span>
</div>
<script src="engine.js"></script>
<script src="ui.js"></script>
<script src="scenes.js"></script>
<script>
  'use strict';
  const params = new URLSearchParams(location.search);
  const renderMode = params.has('render');
  if (renderMode) document.body.classList.add('render');

  const frame = document.getElementById('frame');
  function fit() {
    if (renderMode) { frame.style.transform = ''; return; }
    const k = Math.min(window.innerWidth / 1920, (window.innerHeight - 60) / 1080);
    frame.style.transform = `scale(${k})`;
    frame.style.width = `${1920 * k}px`;
    frame.style.height = `${1080 * k}px`;
  }
  window.addEventListener('resize', fit);
  fit();

  window.reelReady = document.fonts.load('700 100px Inter').then(() => document.fonts.ready).then(() => {
    buildReel();
    window.renderFrame = (t) => { render(t); return true; };
    window.reelInfo = { duration: DURATION, bpm: BPM, cues: CUES };
    if (renderMode) {
      render(params.has('t') ? parseFloat(params.get('t')) : 0);
      return true;
    }
    const scrub = document.getElementById('scrub');
    const clock = document.getElementById('clock');
    const playBtn = document.getElementById('play');
    let playing = true;
    let origin = performance.now() - (params.has('t') ? parseFloat(params.get('t')) * 1000 : 0);
    let at = 0;
    playBtn.onclick = () => {
      playing = !playing;
      playBtn.textContent = playing ? 'Pause' : 'Play';
      origin = performance.now() - at * 1000;
    };
    scrub.oninput = () => { at = scrub.value / 1000; origin = performance.now() - at * 1000; render(at); };
    const loop = (now) => {
      if (playing) {
        at = ((now - origin) / 1000) % DURATION;
        render(at);
        scrub.value = Math.round(at * 1000);
      }
      clock.textContent = `${at.toFixed(3)} s`;
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
    return true;
  });
</script>
</body>
</html>
